cameras:
  # Example: depth camera reading intrinsics from a topic and extrinsics from
  # this file. Pass it with cameras_config_file:= -- see Tutorial 7.
  - name: depth_map_test
    type: depth_camera
    topic: /depth_to_rgb/image_raw
    # Required: the header.frame_id of the depth images. Images from another
    # frame are dropped. It is the TF child frame (or the frame the extrinsics
    # below describe).
    frame_id: rgb_camera_link
    camera_info: /depth_to_rgb/camera_info  # Topic the intrinsics are read from
    #   # Option A: full K matrix (9 elements: fx, 0, cx, 0, fy, cy, 0, 0, 1)
    #   intrinsics: [615.3, 0.0, 320.5, 0.0, 615.8, 240.5, 0.0, 0.0, 1.0]
    #   # Option B: dict form (alternative)
    #   # intrinsics:
    #   #   fx: 615.3
    #   #   fy: 615.8
    #   #   cx: 320.5
    #   #   cy: 240.5
    intrinsics: []  # Empty = read them from the camera_info topic
    # Extrinsics: [x, y, z, qw, qx, qy, qz] (cuRobo order).
    # Empty = resolve TF base frame -> frame_id at each image's header stamp;
    # frames are DROPPED while that transform is unavailable or the stamp is
    # zero, there is no identity or latest-transform fallback.
    extrinsics: [0.161, -0.428, 1.585, -0.3409296, 0.6840516, -0.6215661, 0.1717437]
    # The REAL publication rate of `topic`. cuRobo decrements the weight of ALL
    # voxels once per integrate() call, so the rate driving forgetting is the SUM
    # of the rates declared across the cameras here. The node derives
    # `decay_factor` from `decay_half_life_s` (see obstacle_manager).
    # If this field is missing, a conservative default is used and a warning is
    # logged at startup.
    frame_rate_hz: 30.0
    # TF mode only: how long (s) a depth frame may wait for the TF at its stamp
    # when it arrives before that TF (the next TF sample comes at most one TF
    # publish period later). It is dropped after that; 0 = drop at once.
    # Default 0.05, enough for TF published at 20 Hz or faster.
    tf_wait_max_s: 0.05
